<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>中部 · 政策节点与金融深化（2000—2023）</title>
<!-- 引入 ECharts -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background-color: #ffffff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .chart-container {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .title {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    color: #2f3542;
    margin-top: 20px;
    letter-spacing: 1px;
  }
  #chart {
    flex: 1;
    width: 100%;
    min-height: 0;
  }
</style>
</head>
<body>

<div class="chart-container">
  <div class="title">中部 · 政策节点与金融深化（2000—2023）</div>
  <div id="chart"></div>
</div>

<script>
(function () {
  'use strict';

  /* ================= 1. 数据准备 ================= */
  const years = [];
  for (let i = 2000; i <= 2023; i++) years.push(i.toString());

  // 湖北、安徽的 FIR 数据
  const rawData = {
    '湖北': [1.65241, 2.0682, 2.21601, 2.30945, 2.20317, 2.09928, 2.10062, 1.99172, 1.93357, 2.25019, 2.23608, 2.01768, 2.06786, 2.15527, 2.20582, 2.34298, 2.50466, 2.59099, 2.5329, 2.40925, 2.92406, 2.78957, 2.85896, 2.98954],
    '安徽': [1.60306, 1.69794, 1.81572, 1.92827, 1.91871, 1.95658, 2.02587, 1.98531, 1.96768, 2.27004, 2.28282, 2.20211, 2.32434, 2.42475, 2.53461, 2.77068, 2.91044, 2.96432, 2.98241, 2.65849, 2.88047, 2.8963, 3.16711, 3.39434]
  };

  // 专属颜色映射（严格对应之前折线图的八省颜色）
  const colors = {
    '湖北': '#E60012', // 大红
    '安徽': '#F4B183'  // 浅橙
  };

  /* ================= 2. 公共气泡标签配置 ================= */
  const markLabelStyle = {
    show: true,
    position: 'top',
    formatter: '{c}', // 显示 data 中 value 的内容
    backgroundColor: 'rgba(255, 255, 255, 0.95)',
    borderColor: '#dcdfe6',
    borderWidth: 1,
    borderRadius: 4,
    padding: [4, 8],
    color: '#666666', // 灰色文字
    fontSize: 12,
    fontWeight: 'normal',
    shadowColor: 'rgba(0,0,0,0.08)',
    shadowBlur: 6,
    distance: 12 // 气泡离圆点的距离
  };

  /* ================= 3. 初始化图表 ================= */
  const chart = echarts.init(document.getElementById('chart'));

  const option = {
    // 提示框
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'line' },
      backgroundColor: 'rgba(255,255,255,0.95)',
      borderWidth: 1,
      borderColor: '#eee',
      textStyle: { color: '#333' },
      formatter: function (params) {
        let html = `<div style="font-weight:bold; margin-bottom: 6px;">${params[0].axisValue}年</div>`;
        params.forEach(p => {
          html += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
            <span><span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:${p.color}; margin-right:6px;"></span>${p.seriesName}</span>
            <span style="font-weight:bold; margin-left: 20px;">${p.value.toFixed(2)}</span>
          </div>`;
        });
        return html;
      }
    },
    
    // 布局
    grid: {
      top: 100,
      bottom: 60,
      left: 80,
      right: 120
    },
    
    // X 轴
    xAxis: {
      type: 'category',
      data: years,
      boundaryGap: false,
      axisLine: { lineStyle: { color: '#ddd' } },
      axisTick: { show: false },
      axisLabel: {
        color: '#888',
        interval: function (index, value) {
          return index % 2 === 0 || index === years.length - 1;
        },
        fontSize: 13
      }
    },
    
    // Y 轴
    yAxis: {
      type: 'value',
      min: 1.5,
      max: 5.5,
      interval: 0.5,
      axisLabel: { color: '#888', fontSize: 13 },
      splitLine: { lineStyle: { color: '#f0f2f5', type: 'dashed' } },
      axisLine: { show: false },
      axisTick: { show: false }
    },
    
    // 折线系列
    series: [
      {
        name: '湖北',
        type: 'line',
        data: rawData['湖北'],
        color: colors['湖北'],
        showSymbol: false,
        lineStyle: { width: 2.5 },
        endLabel: {
          show: true,
          formatter: '{a} {c}',
          color: colors['湖北'], // 深红色在白底很清晰
          fontSize: 14,
          fontWeight: 'bold',
          distance: 8
        },
        markPoint: {
          symbol: 'circle',
          symbolSize: 8,
          itemStyle: {
            color: '#fff',
            borderColor: colors['湖北'],
            borderWidth: 2
          },
          label: markLabelStyle,
          data: [
            // 2014 长江经济带指导意见（放湖北线，朝下）
            { 
              name: '2014', 
              value: '2014 长江经济带', 
              coord: ['2014', rawData['湖北'][14]],
              label: { position: 'bottom' }
            },
            // 2021 中部高质量发展意见（放湖北线，朝上）
            { 
              name: '2021', 
              value: '2021 高质量发展意见', 
              coord: ['2021', rawData['湖北'][21]] 
            }
          ]
        }
      },
      {
        name: '安徽',
        type: 'line',
        data: rawData['安徽'],
        color: colors['安徽'],
        showSymbol: false,
        lineStyle: { width: 2.5 },
        endLabel: {
          show: true,
          formatter: '{a} {c}',
          color: '#D97D30', // 浅橙色在白底太亮，文字用偏深的橙色替代以保证可读性
          fontSize: 14,
          fontWeight: 'bold',
          distance: 8
        },
        markPoint: {
          symbol: 'circle',
          symbolSize: 8,
          itemStyle: {
            color: '#fff',
            borderColor: colors['安徽'],
            borderWidth: 2
          },
          label: markLabelStyle,
          data: [
            // 2004 中部崛起提出（放安徽线，朝上）
            { 
              name: '2004', 
              value: '2004 中部崛起提出', 
              coord: ['2004', rawData['安徽'][4]] 
            },
            // 2010 皖江承接产业转移示范区（主角节点，放安徽线，朝上）
            { 
              name: '2010', 
              value: '2010 皖江产业转移', 
              coord: ['2010', rawData['安徽'][10]],
              label: {
                borderColor: colors['安徽'], // 主角节点可以稍微强化气泡边框
                borderWidth: 1.5
              }
            }
          ]
        }
      }
    ]
  };

  chart.setOption(option);

  /* ================= 4. 自适应 ================= */
  window.addEventListener('resize', function () {
    chart.resize();
  });

})();
</script>
</body>
</html>
