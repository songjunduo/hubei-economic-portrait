<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="中国八省金融深化：2000—2023年区域趋势与政策节点。" />
<title>区域金融深化 · 政策节点与长期趋势</title>
<style>
  :root {
    --ink: #1c2430;
    --muted: #6b7785;
    --line: #dde5ee;
    --paper: #ffffff;
    --bg: #f4f7fb;
    --accent: #2f5d8a;
    --accent-soft: #e8f0f8;
    --gold: #b98b4e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    color: var(--ink);
    background:
      radial-gradient(1100px 680px at 8% -12%, #e5eef8 0%, transparent 55%),
      radial-gradient(900px 620px at 102% -4%, #f6ede1 0%, transparent 48%),
      var(--bg);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  }
  .app {
    display: grid;
    grid-template-columns: 252px minmax(0, 1fr);
    height: 100vh;
  }
  aside {
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 26px 18px 20px;
    background: rgba(255,255,255,.72);
    border-right: 1px solid rgba(221,229,238,.9);
    backdrop-filter: blur(14px);
  }
  .brand { display: flex; align-items: center; gap: 12px; padding: 0 6px; }
  .mark {
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    color: #fff;
    background: linear-gradient(145deg, #284c72, #3f739f);
    font-size: 18px;
    font-weight: 700;
    box-shadow: 0 8px 18px rgba(47,93,138,.2);
  }
  .brand h1 { margin: 0; font-size: 17px; line-height: 1.25; letter-spacing: .01em; }
  .brand p { margin: 5px 0 0; color: var(--muted); font-size: 11px; letter-spacing: .16em; }
  .lede { margin: 22px 6px 8px; color: var(--muted); font-size: 12px; line-height: 1.8; }
  #viewNav { margin-top: 8px; overflow: auto; padding: 2px 2px 8px; }
  .group { margin-top: 14px; }
  .group-title { margin: 0 8px 6px; color: #98a4b2; font-size: 10px; letter-spacing: .2em; }
  .view-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 9px 10px;
    border: 0;
    border-radius: 8px;
    color: #435061;
    background: transparent;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: background .18s ease, color .18s ease, transform .18s ease;
  }
  .view-btn:hover { background: #edf3fa; color: var(--accent); transform: translateX(2px); }
  .view-btn.active { background: var(--ink); color: #fff; box-shadow: 0 6px 14px rgba(28,36,48,.16); }
  .view-btn .num { color: #a3afbc; font-size: 10px; font-variant-numeric: tabular-nums; }
  .view-btn.active .num { color: rgba(255,255,255,.55); }
  .aside-note {
    margin-top: auto;
    padding: 14px 8px 0;
    border-top: 1px solid var(--line);
    color: #8b97a5;
    font-size: 11px;
    line-height: 1.8;
  }
  .aside-note a { display: inline-block; margin-top: 8px; color: var(--accent); text-decoration: none; }
  .aside-note a:hover { text-decoration: underline; }
  main { min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 26px 30px 16px; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
  .eyebrow { margin: 0 0 7px; color: var(--gold); font-size: 11px; font-weight: 600; letter-spacing: .18em; }
  .top h2 {
    margin: 0;
    font-family: "Songti SC", "SimSun", serif;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: .02em;
  }
  .sub { margin: 7px 0 0; color: var(--muted); font-size: 12px; letter-spacing: .04em; }
  .year-badge {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 10px 14px;
    border: 1px solid rgba(185,139,78,.32);
    border-radius: 10px;
    color: var(--gold);
    background: rgba(255,255,255,.58);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .year-badge span:first-child { font-size: 19px; font-weight: 700; letter-spacing: .03em; }
  .year-badge span:last-child { font-size: 10px; opacity: .8; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 20px 0 14px; }
  .stat {
    min-width: 0;
    padding: 12px 14px;
    border: 1px solid rgba(221,229,238,.95);
    border-radius: 10px;
    background: rgba(255,255,255,.64);
  }
  .stat span { display: block; color: var(--muted); font-size: 10px; letter-spacing: .08em; }
  .stat strong {
    display: inline-block;
    margin-top: 5px;
    font-size: 19px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stat em { margin-left: 7px; color: #8d99a7; font-size: 10px; font-style: normal; }
  .chart-card {
    position: relative;
    flex: 1 1 auto;
    min-height: 390px;
    overflow: hidden;
    border: 1px solid rgba(221,229,238,.95);
    border-radius: 16px;
    background: rgba(255,255,255,.9);
    box-shadow: 0 18px 44px rgba(36,58,80,.08);
  }
  #chartFrame { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
  .foot {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    margin: 9px 2px 0;
    color: #98a4b1;
    font-size: 10px;
    line-height: 1.7;
  }
  .foot a { color: var(--accent); text-decoration: none; white-space: nowrap; }
  .foot a:hover { text-decoration: underline; }
  @media (max-width: 900px) {
    body { overflow: auto; }
    .app { display: block; height: auto; min-height: 100%; }
    aside { padding: 18px 16px 14px; border-right: 0; border-bottom: 1px solid var(--line); }
    .lede, .aside-note { display: none; }
    #viewNav { display: flex; gap: 4px; padding-top: 12px; overflow-x: auto; }
    .group { margin: 0; }
    .group-title { display: none; }
    .view-btn { width: auto; padding: 7px 10px; }
    .view-btn .num { display: none; }
    main { padding: 18px 16px 14px; }
    .top h2 { font-size: 28px; }
    .stats { grid-template-columns: 1fr 1fr; }
    .chart-card { min-height: 68vh; }
    .foot { display: block; }
    .foot a { display: inline-block; margin-top: 5px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <div class="mark">金</div>
      <div>
        <h1>区域金融<br />深化</h1>
        <p>2000 — 2023</p>
      </div>
    </div>
    <p class="lede">五个视图：先看八省总趋势，再沿东、中、西、东北四条区域线，回到具体年份与政策节点。</p>
    <nav id="viewNav" aria-label="区域视图">
      <div class="group">
        <p class="group-title">全国</p>
        <button class="view-btn active" type="button" data-view="overview">八省总趋势 <span class="num">08</span></button>
      </div>
      <div class="group">
        <p class="group-title">区域</p>
        <button class="view-btn" type="button" data-view="east">东部 <span class="num">03</span></button>
        <button class="view-btn" type="button" data-view="central">中部 <span class="num">02</span></button>
        <button class="view-btn" type="button" data-view="west">西部 <span class="num">02</span></button>
        <button class="view-btn" type="button" data-view="northeast">东北 <span class="num">01</span></button>
      </div>
    </nav>
    <div class="aside-note">图中政策节点只表示时间上的相邻关系，不替代因果判断。<br /><a href="../all.html">← 八省六维画像</a></div>
  </aside>

  <main>
    <div class="top">
      <div>
        <p class="eyebrow" id="eyebrow">全国 · 八省</p>
        <h2 id="viewTitle">八省 FIR 长期趋势</h2>
        <p class="sub" id="viewSub">金融深化 · 2000—2023</p>
      </div>
      <div class="year-badge"><span>2000—2023</span><span>FIR</span></div>
    </div>

    <div class="stats">
      <div class="stat"><span>2023 年 FIR 均值</span><strong id="mean2023">—</strong><em>倍</em></div>
      <div class="stat"><span>2000 → 2023 变化</span><strong id="delta">—</strong><em>均值</em></div>
      <div class="stat"><span>覆盖省份</span><strong id="count">—</strong><em>个</em></div>
    </div>

    <section class="chart-card" aria-label="区域金融深化趋势图">
      <iframe id="chartFrame" src="./overview.html" title="八省金融深化长期趋势" loading="eager"></iframe>
    </section>

    <p class="foot">
      <span>注：FIR＝（金融机构存款余额＋贷款余额）／GDP；图中标注为政策与数据在时间上的相邻关系。</span>
      <a id="openChart" href="./overview.html" target="_blank" rel="noopener">单独打开当前图 ↗</a>
    </p>
  </main>
</div>

<script>
(function () {
  'use strict';
  var STATS = {"overview":{"count":8,"mean2000":2.274375,"mean2023":3.972},"east":{"count":3,"mean2000":2.502666666666667,"mean2023":4.529},"central":{"count":2,"mean2000":1.6275,"mean2023":3.192},"west":{"count":2,"mean2000":2.5300000000000002,"mean2023":3.6645000000000003},"northeast":{"count":1,"mean2000":2.372,"mean2023":4.476}};
  var META = {
    overview: { title: '八省 FIR 长期趋势', eyebrow: '全国 · 八省', sub: '金融深化 · 2000—2023' },
    east: { title: '东部 FIR 轨迹', eyebrow: '东部 · 粤苏浙', sub: '开放、产业升级与金融加速' },
    central: { title: '中部 FIR 轨迹', eyebrow: '中部 · 鄂皖', sub: '崛起、承接与两条不同的曲线' },
    west: { title: '西部 FIR 轨迹', eyebrow: '西部 · 川陕', sub: '大开发、开放与高开低走' },
    northeast: { title: '东北 FIR 轨迹', eyebrow: '东北 · 辽宁', sub: '振兴、口径与高位停驻' }
  };
  var VIEWS = {
    overview: './overview.html',
    east: './east.html',
    central: './central.html',
    west: './west.html',
    northeast: './northeast.html'
  };
  var frame = document.getElementById('chartFrame');
  var openChart = document.getElementById('openChart');
  var title = document.getElementById('viewTitle');
  var eyebrow = document.getElementById('eyebrow');
  var sub = document.getElementById('viewSub');
  var meanEl = document.getElementById('mean2023');
  var deltaEl = document.getElementById('delta');
  var countEl = document.getElementById('count');
  var buttons = Array.prototype.slice.call(document.querySelectorAll('.view-btn'));
  var current = 'overview';

  function fmt(v, digits) { return Number(v).toFixed(digits == null ? 3 : digits); }
  function validView(value) {
    return Object.prototype.hasOwnProperty.call(VIEWS, value) ? value : 'overview';
  }
  function injectFrameCss() {
    try {
      var doc = frame.contentDocument;
      if (!doc || !doc.head) return;
      var style = doc.getElementById('shell-injected');
      if (!style) {
        style = doc.createElement('style');
        style.id = 'shell-injected';
        doc.head.appendChild(style);
      }
      style.textContent = [
        'html,body{background:#fff !important;}',
        'body{padding:0 !important;overflow:hidden !important;}',
        '.title{display:none !important;}',
        '.card{width:100% !important;height:100% !important;border-radius:0 !important;box-shadow:none !important;background:#fff !important;}',
        '.chart-wrap{min-height:0 !important;}',
        '.footnote{display:none !important;}'
      ].join('');
    } catch (e) { /* cross-origin fallback */ }
  }
  function activate(view, push) {
    current = validView(view);
    buttons.forEach(function (b) { b.classList.toggle('active', b.dataset.view === current); });
    var meta = META[current];
    var stat = STATS[current];
    title.textContent = meta.title;
    eyebrow.textContent = meta.eyebrow;
    sub.textContent = meta.sub;
    meanEl.textContent = fmt(stat.mean2023, 3);
    deltaEl.textContent = (stat.mean2023 - stat.mean2000 >= 0 ? '+' : '') + fmt(stat.mean2023 - stat.mean2000, 3);
    countEl.textContent = String(stat.count);
    var next = VIEWS[current];
    if (frame.getAttribute('src') !== next) frame.setAttribute('src', next);
    openChart.href = next;
    if (push) {
      var url = new URL(window.location.href);
      if (current === 'overview') url.searchParams.delete('v');
      else url.searchParams.set('v', current);
      history.replaceState(null, '', url.pathname + url.search);
    }
  }
  buttons.forEach(function (b) {
    b.addEventListener('click', function () { activate(b.dataset.view, true); });
  });
  frame.addEventListener('load', injectFrameCss);
  activate(new URLSearchParams(window.location.search).get('v'), false);
})();
</script>
</body>
</html>
