<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>图2 八省金融深化长期趋势（2000—2023）</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #eef1f6;
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    box-sizing: border-box;
  }
  .card {
    position: relative;
    width: min(1000px, 100%);
    height: min(720px, calc(100vh - 24px));
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 12px 36px rgba(31, 45, 61, 0.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .chart-wrap {
    flex: 1;
    min-height: 0;
  }
  #chart { width: 100%; height: 100%; }
  .footnote {
    padding: 10px 28px 16px;
    font-size: 12px;
    color: #7a8494;
    line-height: 1.6;
    border-top: 1px solid #f0f2f5;
    background: #fafbfc;
  }
</style>
</head>
<body>
<div class="card">
  <div class="chart-wrap"><div id="chart"></div></div>
  <div class="footnote">FIR=（金融机构各项存款余额+各项贷款余额）/地区生产总值，为基于存贷款规模的金融深化代理指标，不等同于金融发展质量。</div>
</div>

<script>
(function () {
  'use strict';

  /* ================= 基本参数 ================= */
  const START_YEAR  = 2000;
  const END_YEAR    = 2023;
  const MAX_IDX     = END_YEAR - START_YEAR;   // 23
  const MS_PER_YEAR = 600;                     // 每年前进速度（毫秒）
  const HOLD_MS     = 1500;                    // 播到 2023 后停留时间

  /* ================= 数据：图2_FIR序列 ================= */
  const PROVINCES = [
    { name: '广东', color: '#2E75B6', data: [3.72622, 3.41916, 3.58349, 3.58992, 3.39904, 3.28401, 3.17472, 3.02016, 3.00105, 3.48088, 3.52025, 3.39706, 3.59281, 3.75416, 3.68451, 4.31162, 3.59604, 3.57357, 3.63105, 3.71923, 4.18305, 4.14413, 4.39968, 4.58786] },
    { name: '江苏', color: '#9DC3E6', data: [1.67411, 1.73128, 1.89649, 2.14404, 2.11229, 2.01079, 2.03962, 2.01944, 2.03919, 2.44207, 2.44065, 2.313, 2.40285, 2.46749, 2.50903, 2.66328, 2.7422, 2.70242, 2.75864, 2.87226, 3.18445, 3.15736, 3.38676, 3.69417] },
    { name: '浙江', color: '#F48FB1', data: [2.10775, 2.21869, 2.58515, 2.86803, 2.81899, 2.84998, 2.91146, 2.87784, 3.03459, 3.66832, 3.65846, 3.53145, 3.64018, 3.68336, 3.74886, 3.88859, 3.83767, 3.81612, 3.9555, 4.05843, 4.57871, 4.57821, 4.96877, 5.3052] },
    { name: '湖北', color: '#E60012', data: [1.65241, 2.0682, 2.21601, 2.30945, 2.20317, 2.09928, 2.10062, 1.99172, 1.93357, 2.25019, 2.23608, 2.01768, 2.06786, 2.15527, 2.20582, 2.34298, 2.50466, 2.59099, 2.5329, 2.40925, 2.92406, 2.78957, 2.85896, 2.98954] },
    { name: '安徽', color: '#F4B183', data: [1.60306, 1.69794, 1.81572, 1.92827, 1.91871, 1.95658, 2.02587, 1.98531, 1.96768, 2.27004, 2.28282, 2.20211, 2.32434, 2.42475, 2.53461, 2.77068, 2.91044, 2.96432, 2.98241, 2.65849, 2.88047, 2.8963, 3.16711, 3.39434] },
    { name: '四川', color: '#FFD700', data: [2.13619, 2.27212, 2.37751, 2.46505, 2.43191, 2.76564, 2.69476, 2.51849, 2.82048, 3.38266, 2.87623, 2.73393, 2.83754, 2.97138, 3.05013, 3.26683, 3.2934, 3.23729, 3.20041, 3.0649, 3.28929, 3.29817, 3.54606, 3.76854] },
    { name: '陕西', color: '#A9D18E', data: [2.92375, 2.85605, 2.99509, 3.14667, 2.90021, 2.65135, 2.51196, 2.36614, 2.3033, 2.70962, 2.61661, 2.48494, 2.52692, 2.5792, 2.65397, 3.00612, 3.08933, 2.97175, 2.9327, 3.05793, 3.38534, 3.32219, 3.38139, 3.56013] },
    { name: '辽宁', color: '#7F7F7F', data: [2.37213, 2.42174, 2.537, 2.69301, 2.68852, 2.47601, 2.44118, 2.28601, 2.19612, 2.51821, 2.49562, 2.4144, 2.47963, 2.54068, 2.62262, 2.93142, 4.0625, 4.08077, 4.10822, 4.50753, 4.7859, 4.46381, 4.47614, 4.47563] }
  ];

  /* ================= 初始化图表 ================= */
  const chart = echarts.init(document.getElementById('chart'), null, { renderer: 'canvas' });

  const option = {
    animation: false,                    // 动画由 requestAnimationFrame 手动驱动
    title: { show: false },
    legend: {
      bottom: 28,
      type: 'plain',
      itemWidth: 16,
      itemHeight: 10,
      itemGap: 14,
      textStyle: { color: '#4a4a4a', fontSize: 13 }
    },
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'line' },
      valueFormatter: function (v) { return v == null ? '-' : v.toFixed(3); }
    },
    grid: {
      left: 92,
      right: 130,
      top: 40,
      bottom: 100
    },
    xAxis: {
      type: 'value',
      min: START_YEAR,
      max: END_YEAR,
      interval: 2,
      name: '年份',
      nameLocation: 'middle',
      nameGap: 38,
      nameTextStyle: { color: '#4a4a4a', fontSize: 13, fontWeight: 'bold' },
      axisLine: { lineStyle: { color: '#dcdfe6' } },
      axisTick: { show: false },
      splitLine: { show: false },
      axisLabel: {
        color: '#8b95a1',
        fontSize: 12,
        formatter: function (v) { return Math.round(v); }
      }
    },
    yAxis: {
      type: 'value',
      min: 1.0,
      max: 5.5,
      interval: 0.5,
      name: 'FIR（存贷款余额/GDP）',
      nameLocation: 'middle',
      nameGap: 58,
      nameTextStyle: { color: '#4a4a4a', fontSize: 13, fontWeight: 'bold' },
      axisLabel: { formatter: '{value}', color: '#8b95a1', fontSize: 12 },
      axisLine: { show: false },
      axisTick: { show: false },
      splitLine: { lineStyle: { color: '#eef0f3', type: 'dashed' } }
    },
    series: PROVINCES.map(function (p) {
      return {
        name: p.name,
        type: 'line',
        showSymbol: true,
        symbol: 'circle',
        symbolSize: 5,
        lineStyle: { width: 2.5, color: p.color },
        itemStyle: { color: p.color },
        emphasis: { focus: 'series' },
        data: []
      };
    })
  };

  chart.setOption(option);

  /* ================= 动画状态机 ================= */
  let progress    = MAX_IDX;
  let phase       = 'hold';   // 'run' | 'hold'
  let holdElapsed = 0;
  let lastTs      = 0;

  /**
   * 根据当前进度构造某条线的可见数据点
   * 前面的完整年份 + 末端一个插值点，实现"跑道式"平滑前伸
   */
  function buildLineData(vals, prog) {
    const idx = Math.min(Math.floor(prog), MAX_IDX);
    const t   = prog - idx;
    const pts = [];
    for (let i = 0; i <= idx; i++) {
      pts.push([START_YEAR + i, vals[i]]);
    }
    if (prog < MAX_IDX && t > 0.0001) {
      const y = vals[idx] + (vals[idx + 1] - vals[idx]) * t;
      pts.push([START_YEAR + prog, y]);
    }
    return pts;
  }

  function draw() {
    chart.setOption({
      series: PROVINCES.map(function (p) {
        return { data: buildLineData(p.data, progress) };
      })
    }, { lazyUpdate: true });
  }

  function tick(ts) {
    requestAnimationFrame(tick);

    if (!lastTs) { lastTs = ts; return; }
    let dt = ts - lastTs;
    lastTs = ts;
    if (dt > 120) dt = 120;            // 切标签页回来后防止跳帧

    if (phase === 'run') {
      progress += dt / MS_PER_YEAR;
      if (progress >= MAX_IDX) {
        progress = MAX_IDX;
        phase = 'hold';
        holdElapsed = 0;
      }
    } else {
      holdElapsed += dt;
      if (holdElapsed >= HOLD_MS) {
        progress = 0;
        phase = 'run';
      }
    }

    draw();
  }

  // 首帧：直接展示完整序列
  progress = MAX_IDX;
  draw();

  /* ================= 自适应 ================= */
  window.addEventListener('resize', function () {
    chart.resize();
  });
})();
</script>
</body>
</html>
