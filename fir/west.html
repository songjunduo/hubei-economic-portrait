<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>西部 · 政策节点与金融深化（2000—2023）</title>
<!-- 引入 ECharts -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background-color: #ffffff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .chart-container {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .title {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    color: #2f3542;
    margin-top: 20px;
    letter-spacing: 1px;
  }
  #chart {
    flex: 1;
    width: 100%;
    min-height: 0;
  }
</style>
</head>
<body>

<div class="chart-container">
  <div class="title">西部 · 政策节点与金融深化（2000—2023）</div>
  <div id="chart"></div>
</div>

<script>
(function () {
  'use strict';

  /* ================= 1. 数据准备 ================= */
  const years = [];
  for (let i = 2000; i <= 2023; i++) years.push(i.toString());

  // 四川、陕西的 FIR 数据
  const rawData = {
    '四川': [2.13619, 2.27212, 2.37751, 2.46505, 2.43191, 2.76564, 2.69476, 2.51849, 2.82048, 3.38266, 2.87623, 2.73393, 2.83754, 2.97138, 3.05013, 3.26683, 3.2934, 3.23729, 3.20041, 3.0649, 3.28929, 3.29817, 3.54606, 3.76854],
    '陕西': [2.92375, 2.85605, 2.99509, 3.14667, 2.90021, 2.65135, 2.51196, 2.36614, 2.3033, 2.70962, 2.61661, 2.48494, 2.52692, 2.5792, 2.65397, 3.00612, 3.08933, 2.97175, 2.9327, 3.05793, 3.38534, 3.32219, 3.38139, 3.56013]
  };

  // 专属颜色映射（严格对应之前折线图的八省颜色）
  const colors = {
    '四川': '#FFD700', // 正黄
    '陕西': '#A9D18E'  // 浅绿
  };

  /* ================= 2. 公共气泡标签配置 ================= */
  const markLabelStyle = {
    show: true,
    position: 'top',
    formatter: '{c}', // 显示 data 中 value 的内容
    backgroundColor: 'rgba(255, 255, 255, 0.95)',
    borderColor: '#dcdfe6',
    borderWidth: 1,
    borderRadius: 4,
    padding: [4, 8],
    color: '#666666', // 灰色文字
    fontSize: 12,
    fontWeight: 'normal',
    shadowColor: 'rgba(0,0,0,0.08)',
    shadowBlur: 6,
    distance: 12 // 气泡离圆点的距离
  };

  /* ================= 3. 初始化图表 ================= */
  const chart = echarts.init(document.getElementById('chart'));

  const option = {
    // 提示框
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'line' },
      backgroundColor: 'rgba(255,255,255,0.95)',
      borderWidth: 1,
      borderColor: '#eee',
      textStyle: { color: '#333' },
      formatter: function (params) {
        let html = `<div style="font-weight:bold; margin-bottom: 6px;">${params[0].axisValue}年</div>`;
        params.forEach(p => {
          html += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
            <span><span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:${p.color}; margin-right:6px;"></span>${p.seriesName}</span>
            <span style="font-weight:bold; margin-left: 20px;">${p.value.toFixed(2)}</span>
          </div>`;
        });
        return html;
      }
    },
    
    // 布局
    grid: {
      top: 100,
      bottom: 60,
      left: 80,
      right: 120
    },
    
    // X 轴
    xAxis: {
      type: 'category',
      data: years,
      boundaryGap: false,
      axisLine: { lineStyle: { color: '#ddd' } },
      axisTick: { show: false },
      axisLabel: {
        color: '#888',
        interval: function (index, value) {
          return index % 2 === 0 || index === years.length - 1;
        },
        fontSize: 13
      }
    },
    
    // Y 轴
    yAxis: {
      type: 'value',
      min: 1.5,
      max: 5.5,
      interval: 0.5,
      axisLabel: { color: '#888', fontSize: 13 },
      splitLine: { lineStyle: { color: '#f0f2f5', type: 'dashed' } },
      axisLine: { show: false },
      axisTick: { show: false }
    },
    
    // 折线系列
    series: [
      {
        name: '四川',
        type: 'line',
        data: rawData['四川'],
        color: colors['四川'],
        showSymbol: false,
        lineStyle: { width: 2.5 },
        endLabel: {
          show: true,
          formatter: '{a} {c}',
          color: '#D4A000', // 正黄线尾字较浅，稍作加深以保证白底可见性
          fontSize: 14,
          fontWeight: 'bold',
          distance: 8
        },
        markPoint: {
          symbol: 'circle',
          symbolSize: 8,
          itemStyle: {
            color: '#fff',
            borderColor: colors['四川'],
            borderWidth: 2
          },
          label: markLabelStyle,
          data: [
            // 2014 西咸新区·天府新区获批（放四川线上，朝上）
            { 
              name: '2014', 
              value: '2014 天府/西咸新区', 
              coord: ['2014', rawData['四川'][14]] 
            },
            // 2020 成渝双城经济圈提出（放四川线上，朝下，与陕西错开）
            { 
              name: '2020', 
              value: '2020 成渝双城经济圈', 
              coord: ['2020', rawData['四川'][20]],
              label: { position: 'bottom' }
            }
          ]
        }
      },
      {
        name: '陕西',
        type: 'line',
        data: rawData['陕西'],
        color: colors['陕西'],
        showSymbol: false,
        lineStyle: { width: 2.5 },
        endLabel: {
          show: true,
          formatter: '{a} {c}',
          color: '#6B9A4E', // 浅绿线尾字较浅，稍作加深
          fontSize: 14,
          fontWeight: 'bold',
          distance: 8
        },
        markPoint: {
          symbol: 'circle',
          symbolSize: 8,
          itemStyle: {
            color: '#fff',
            borderColor: colors['陕西'],
            borderWidth: 2
          },
          label: markLabelStyle,
          data: [
            // 2000 西部大开发启动（朝上）
            { 
              name: '2000', 
              value: '2000 西部大开发', 
              coord: ['2000', rawData['陕西'][0]] 
            },
            // 2013 "一带一路"倡议（朝下，避开旁边的2014节点）
            { 
              name: '2013', 
              value: '2013 一带一路', 
              coord: ['2013', rawData['陕西'][13]],
              label: { position: 'bottom' }
            },
            // 2020 新时代西部大开发意见（朝上，与四川错开）
            { 
              name: '2020', 
              value: '2020 新时代大开发', 
              coord: ['2020', rawData['陕西'][20]] 
            }
          ]
        }
      }
    ]
  };

  chart.setOption(option);

  /* ================= 4. 自适应 ================= */
  window.addEventListener('resize', function () {
    chart.resize();
  });

})();
</script>
</body>
</html>
