<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>陕西 · 四川 2000—2023 三次产业结构动态堆积柱</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #eef1f6;
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    position: relative;
    width: 640px;
    height: 660px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 12px 36px rgba(31, 45, 61, 0.12);
    overflow: hidden;
  }
  #chart { width: 100%; height: 100%; }

  /* 年份角标 */
  .year-badge {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    padding: 6px 22px;
    background: #2f3542;
    color: #fff;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 3px;
    border-radius: 10px;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 6px 16px rgba(47, 53, 66, 0.22);
    pointer-events: none;
  }
  .subtitle {
    position: absolute;
    top: 68px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    letter-spacing: 2px;
    color: #97a1af;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="card">
  <div id="chart"></div>
  <div class="year-badge" id="yearBadge">2000</div>
  <div class="subtitle">陕西 · 四川　三次产业结构占比</div>
</div>

<script>
(function () {
  'use strict';

  /* ================= 数据 ================= */
  const PROVINCES = ['陕西', '四川'];

  // 每条记录：{ year, sx:[一,二,三], sc:[一,二,三] }
  const DATA = [
    { year: 2000, sx: [14.16, 42.92, 42.92], sc: [23.78, 36.05, 40.17] },
    { year: 2001, sx: [12.96, 43.20, 43.84], sc: [22.56, 36.13, 41.30] },
    { year: 2002, sx: [12.37, 44.17, 43.46], sc: [21.88, 36.18, 41.94] },
    { year: 2003, sx: [11.56, 46.63, 41.81], sc: [20.81, 37.26, 41.93] },
    { year: 2004, sx: [11.22, 47.38, 41.39], sc: [20.78, 38.15, 41.07] },
    { year: 2005, sx: [10.85, 46.87, 42.28], sc: [19.26, 40.63, 40.11] },
    { year: 2006, sx: [10.04, 48.92, 41.03], sc: [18.76, 42.53, 38.71] },
    { year: 2007, sx: [9.77,  49.93, 40.30], sc: [18.39, 43.08, 38.53] },
    { year: 2008, sx: [9.89,  50.52, 39.59], sc: [16.53, 44.56, 38.91] },
    { year: 2009, sx: [9.28,  49.63, 41.09], sc: [15.01, 46.22, 38.78] },
    { year: 2010, sx: [9.49,  50.85, 39.65], sc: [13.65, 47.42, 38.92] },
    { year: 2011, sx: [9.64,  52.63, 37.73], sc: [13.39, 46.99, 39.62] },
    { year: 2012, sx: [9.19,  53.19, 37.62], sc: [12.97, 46.36, 40.67] },
    { year: 2013, sx: [9.09,  52.26, 38.65], sc: [12.13, 46.24, 41.63] },
    { year: 2014, sx: [8.88,  51.29, 39.83], sc: [12.01, 44.56, 43.43] },
    { year: 2015, sx: [8.80,  47.64, 43.57], sc: [11.88, 42.79, 45.33] },
    { year: 2016, sx: [8.76,  46.02, 45.22], sc: [11.51, 39.70, 48.79] },
    { year: 2017, sx: [8.00,  46.45, 45.56], sc: [11.07, 37.83, 51.11] },
    { year: 2018, sx: [7.51,  46.05, 46.44], sc: [10.17, 36.88, 52.95] },
    { year: 2019, sx: [7.60,  44.21, 48.19], sc: [10.19, 36.47, 53.34] },
    { year: 2020, sx: [8.62,  40.77, 50.61], sc: [11.24, 35.58, 53.18] },
    { year: 2021, sx: [7.91,  42.54, 49.56], sc: [10.27, 36.31, 53.42] },
    { year: 2022, sx: [7.79,  43.18, 49.03], sc: [10.35, 35.26, 54.38] },
    { year: 2023, sx: [7.80,  41.02, 51.18], sc: [8.89,  35.66, 55.45] }
  ];

  const MAX_IDX     = DATA.length - 1;   // 23
  const MS_PER_YEAR = 800;               // 每年前进速度
  const HOLD_MS     = 1200;              // 播到 2023 后停留时间

  const COLOR_1 = '#4CAF50';             // 一产 绿
  const COLOR_2 = '#FF9800';             // 二产 橙
  const COLOR_3 = '#2196F3';             // 三产 蓝

  /* ================= 初始化图表 ================= */
  const chartDom = document.getElementById('chart');
  const chart = echarts.init(chartDom, null, { renderer: 'canvas' });

  const option = {
    animation: false,
    grid: { left: 72, right: 56, top: 132, bottom: 84 },
    legend: {
      bottom: 22,
      itemWidth: 16,
      itemHeight: 12,
      itemGap: 30,
      textStyle: { color: '#4a4a4a', fontSize: 14 }
    },
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'shadow' }
    },
    xAxis: {
      type: 'category',
      data: PROVINCES,
      axisLine: { lineStyle: { color: '#dcdfe6' } },
      axisTick: { show: false },
      axisLabel: {
        color: '#4a4a4a',
        fontSize: 18,
        fontWeight: 'bold',
        letterSpacing: 2
      }
    },
    yAxis: {
      type: 'value',
      min: 0,
      max: 100,
      interval: 20,
      axisLabel: { formatter: '{value}%', color: '#8b95a1', fontSize: 13 },
      axisLine: { show: false },
      axisTick: { show: false },
      splitLine: { lineStyle: { color: '#eef0f3', type: 'dashed' } }
    },
    series: [
      {
        name: '第一产业',
        type: 'bar',
        stack: 'total',
        barWidth: 120,
        itemStyle: { color: COLOR_1 },
        label: {
          show: true,
          position: 'inside',
          color: '#ffffff',
          fontSize: 12,
          fontWeight: 'bold',
          formatter: function (p) { return p.value.toFixed(1) + '%'; }
        },
        data: [DATA[0].sx[0], DATA[0].sc[0]]
      },
      {
        name: '第二产业',
        type: 'bar',
        stack: 'total',
        barWidth: 120,
        itemStyle: { color: COLOR_2 },
        label: {
          show: true,
          position: 'inside',
          color: '#ffffff',
          fontSize: 12,
          fontWeight: 'bold',
          formatter: function (p) { return p.value.toFixed(1) + '%'; }
        },
        data: [DATA[0].sx[1], DATA[0].sc[1]]
      },
      {
        name: '第三产业',
        type: 'bar',
        stack: 'total',
        barWidth: 120,
        itemStyle: { color: COLOR_3 },
        label: {
          show: true,
          position: 'inside',
          color: '#ffffff',
          fontSize: 12,
          fontWeight: 'bold',
          formatter: function (p) { return p.value.toFixed(1) + '%'; }
        },
        data: [DATA[0].sx[2], DATA[0].sc[2]]
      }
    ]
  };

  chart.setOption(option);

  /* ================= 动画状态机 ================= */
  const badge = document.getElementById('yearBadge');

  let progress    = 0;
  let phase       = 'run';
  let holdElapsed = 0;
  let lastTs      = 0;
  let lastYear    = -1;

  /**
   * 根据 progress 计算两省三产占比并刷新图表
   * 相邻年份线性插值，每根柱子的分界线连续滑动
   */
  function draw() {
    const idx = Math.min(Math.floor(progress), MAX_IDX - 1);
    const t   = progress - idx;
    const a   = DATA[idx];
    const b   = DATA[Math.min(idx + 1, MAX_IDX)];

    const keys = ['sx', 'sc'];
    const v1 = [], v2 = [], v3 = [];

    for (let k = 0; k < keys.length; k++) {
      const key = keys[k];
      let s1 = a[key][0] + (b[key][0] - a[key][0]) * t;
      let s2 = a[key][1] + (b[key][1] - a[key][1]) * t;
      let s3 = a[key][2] + (b[key][2] - a[key][2]) * t;

      // 归一化到 100%，保证柱顶落在 100% 刻度线上
      const sum = s1 + s2 + s3;
      v1.push(s1 / sum * 100);
      v2.push(s2 / sum * 100);
      v3.push(s3 / sum * 100);
    }

    chart.setOption({
      series: [
        { data: v1 },
        { data: v2 },
        { data: v3 }
      ]
    }, { lazyUpdate: true });

    const year = DATA[Math.round(progress)].year;
    if (year !== lastYear) {
      lastYear = year;
      badge.textContent = year;
    }
  }

  function tick(ts) {
    requestAnimationFrame(tick);

    if (!lastTs) { lastTs = ts; return; }
    let dt = ts - lastTs;
    lastTs = ts;
    if (dt > 120) dt = 120;

    if (phase === 'run') {
      progress += dt / MS_PER_YEAR;
      if (progress >= MAX_IDX) {
        progress = MAX_IDX;
        phase = 'hold';
        holdElapsed = 0;
      }
    } else {
      holdElapsed += dt;
      if (holdElapsed >= HOLD_MS) {
        progress = 0;
        phase = 'run';
      }
    }

    draw();
  }

  // 首帧
  draw();
  requestAnimationFrame(tick);

  /* ================= 自适应 ================= */
  window.addEventListener('resize', function () {
    chart.resize();
  });
})();
</script>
</body>
</html>
