<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="中国八省区域产业结构与三次产业增速：2000—2023年动态图。" />
<title>区域产业结构与增速 · 动画</title>
<style>
  :root {
    --ink: #1c2430;
    --muted: #6b7785;
    --line: #dde5ee;
    --bg: #f4f7fb;
    --accent: #2f5d8a;
    --gold: #b98b4e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    color: var(--ink);
    background:
      radial-gradient(1100px 680px at 8% -12%, #e5eef8 0%, transparent 55%),
      radial-gradient(900px 620px at 102% -4%, #f6ede1 0%, transparent 48%),
      var(--bg);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  }
  .app { display: grid; grid-template-columns: 252px minmax(0, 1fr); height: 100vh; }
  aside {
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 26px 18px 20px;
    background: rgba(255,255,255,.72);
    border-right: 1px solid rgba(221,229,238,.9);
    backdrop-filter: blur(14px);
  }
  .brand { display: flex; align-items: center; gap: 12px; padding: 0 6px; }
  .mark {
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    color: #fff;
    background: linear-gradient(145deg, #284c72, #3f739f);
    font-size: 17px;
    font-weight: 700;
    box-shadow: 0 8px 18px rgba(47,93,138,.2);
  }
  .brand h1 { margin: 0; font-size: 17px; line-height: 1.25; letter-spacing: .01em; }
  .brand p { margin: 5px 0 0; color: var(--muted); font-size: 11px; letter-spacing: .16em; }
  .lede { margin: 22px 6px 8px; color: var(--muted); font-size: 12px; line-height: 1.8; }
  #nav { margin-top: 8px; overflow: auto; padding: 2px 2px 8px; }
  .group { margin-top: 14px; }
  .group-title { margin: 0 8px 6px; color: #98a4b2; font-size: 10px; letter-spacing: .2em; }
  .view-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 9px 10px;
    border: 0;
    border-radius: 8px;
    color: #435061;
    background: transparent;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: background .18s ease, color .18s ease, transform .18s ease;
  }
  .view-btn:hover { background: #edf3fa; color: var(--accent); transform: translateX(2px); }
  .view-btn.active { background: var(--ink); color: #fff; box-shadow: 0 6px 14px rgba(28,36,48,.16); }
  .view-btn .kind { color: #a3afbc; font-size: 10px; letter-spacing: .08em; }
  .view-btn.active .kind { color: rgba(255,255,255,.55); }
  .aside-note {
    margin-top: auto;
    padding: 14px 8px 0;
    border-top: 1px solid var(--line);
    color: #8b97a5;
    font-size: 11px;
    line-height: 1.8;
  }
  .aside-note a { display: inline-block; margin-top: 7px; color: var(--accent); text-decoration: none; }
  .aside-note a:hover { text-decoration: underline; }
  main { min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 26px 30px 16px; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
  .eyebrow { margin: 0 0 7px; color: var(--gold); font-size: 11px; font-weight: 600; letter-spacing: .18em; }
  .top h2 {
    margin: 0;
    font-family: "Songti SC", "SimSun", serif;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: .02em;
  }
  .sub { margin: 7px 0 0; color: var(--muted); font-size: 12px; letter-spacing: .04em; }
  .badge {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border: 1px solid rgba(185,139,78,.32);
    border-radius: 10px;
    color: var(--gold);
    background: rgba(255,255,255,.58);
    font-size: 11px;
    white-space: nowrap;
  }
  .badge strong { font-size: 18px; letter-spacing: .03em; }
  .replay {
    padding: 8px 12px;
    border: 1px solid rgba(47,93,138,.24);
    border-radius: 8px;
    color: var(--accent);
    background: rgba(255,255,255,.7);
    font: inherit;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
  }
  .replay:hover { background: #e8f0f8; }
  .chart-card {
    position: relative;
    flex: 1 1 auto;
    min-height: 420px;
    margin-top: 20px;
    overflow: hidden;
    border: 1px solid rgba(221,229,238,.95);
    border-radius: 16px;
    background: rgba(255,255,255,.9);
    box-shadow: 0 18px 44px rgba(36,58,80,.08);
  }
  #chartFrame { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
  .foot {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    margin: 9px 2px 0;
    color: #98a4b1;
    font-size: 10px;
    line-height: 1.7;
  }
  .foot a { color: var(--accent); text-decoration: none; white-space: nowrap; }
  .foot a:hover { text-decoration: underline; }
  @media (max-width: 900px) {
    body { overflow: auto; }
    .app { display: block; height: auto; min-height: 100%; }
    aside { padding: 18px 16px 14px; border-right: 0; border-bottom: 1px solid var(--line); }
    .lede, .aside-note { display: none; }
    #nav { display: flex; gap: 4px; padding-top: 12px; overflow-x: auto; }
    .group { margin: 0; }
    .group-title { display: none; }
    .view-btn { width: auto; padding: 7px 10px; }
    .view-btn .kind { display: none; }
    main { padding: 18px 16px 14px; }
    .top h2 { font-size: 26px; }
    .badge { display: none; }
    .chart-card { min-height: 70vh; margin-top: 14px; }
    .foot { display: block; }
    .foot a { display: inline-block; margin-top: 5px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <div class="mark">产</div>
      <div>
        <h1>区域产业<br />结构</h1>
        <p>2000 — 2023</p>
      </div>
    </div>
    <p class="lede">八张图，两种看法：结构看三次产业占比，增速看三次产业变化。进入页面即播放动画。</p>
    <nav id="nav" aria-label="区域图表">
      <div class="group">
        <p class="group-title">产业结构 · 堆积柱</p>
        <button class="view-btn active" type="button" data-view="east-bar">东部 <span class="kind">粤苏浙</span></button>
        <button class="view-btn" type="button" data-view="central-bar">中部 <span class="kind">鄂皖</span></button>
        <button class="view-btn" type="button" data-view="west-bar">西部 <span class="kind">川陕</span></button>
        <button class="view-btn" type="button" data-view="northeast-bar">东北 <span class="kind">辽宁</span></button>
      </div>
      <div class="group">
        <p class="group-title">产业增速 · 折线</p>
        <button class="view-btn" type="button" data-view="east-line">东部 <span class="kind">粤苏浙</span></button>
        <button class="view-btn" type="button" data-view="central-line">中部 <span class="kind">鄂皖</span></button>
        <button class="view-btn" type="button" data-view="west-line">西部 <span class="kind">川陕</span></button>
        <button class="view-btn" type="button" data-view="northeast-line">东北 <span class="kind">辽宁</span></button>
      </div>
    </nav>
    <div class="aside-note">柱状图按三次产业占比堆积到 100%；折线图为三次产业增速。动画用于比较年份变化，不代表因果。<br /><a href="../fir/">← 区域金融深化</a>　<a href="../all.html">八省画像</a></div>
  </aside>

  <main>
    <div class="top">
      <div>
        <p class="eyebrow" id="eyebrow">产业结构 · 东部</p>
        <h2 id="viewTitle">东部 · 三次产业结构</h2>
        <p class="sub" id="viewSub">粤苏浙 · 2000—2023 动态堆积柱</p>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="badge"><strong>2000—2023</strong><span>动画</span></div>
        <button class="replay" id="replay" type="button">重播</button>
      </div>
    </div>

    <section class="chart-card" aria-label="区域产业结构与增速动画">
      <iframe id="chartFrame" src="./east-bar.html" title="东部三次产业结构动画" loading="eager"></iframe>
    </section>

    <p class="foot">
      <span>注：柱状图为三次产业占比，折线图为三次产业增速；数据来源：八省统计年鉴。</span>
      <a id="openChart" href="./east-bar.html" target="_blank" rel="noopener">单独打开当前图 ↗</a>
    </p>
  </main>
</div>

<script>
(function () {
  'use strict';
  var META = {
    'east-bar': { eyebrow: '产业结构 · 东部', title: '东部 · 三次产业结构', sub: '粤苏浙 · 2000—2023 动态堆积柱', type: '结构' },
    'central-bar': { eyebrow: '产业结构 · 中部', title: '中部 · 三次产业结构', sub: '鄂皖 · 2000—2023 动态堆积柱', type: '结构' },
    'west-bar': { eyebrow: '产业结构 · 西部', title: '西部 · 三次产业结构', sub: '川陕 · 2000—2023 动态堆积柱', type: '结构' },
    'northeast-bar': { eyebrow: '产业结构 · 东北', title: '东北 · 三次产业结构', sub: '辽宁 · 2000—2023 动态堆积柱', type: '结构' },
    'east-line': { eyebrow: '产业增速 · 东部', title: '东部 · 三次产业增速', sub: '粤苏浙 · 2001—2023 增速折线', type: '增速' },
    'central-line': { eyebrow: '产业增速 · 中部', title: '中部 · 三次产业增速', sub: '鄂皖 · 2001—2023 增速折线', type: '增速' },
    'west-line': { eyebrow: '产业增速 · 西部', title: '西部 · 三次产业增速', sub: '川陕 · 2001—2023 增速折线', type: '增速' },
    'northeast-line': { eyebrow: '产业增速 · 东北', title: '东北 · 三次产业增速', sub: '辽宁 · 2001—2023 增速折线', type: '增速' }
  };
  var VIEWS = {
    'east-bar': './east-bar.html',
    'central-bar': './central-bar.html',
    'west-bar': './west-bar.html',
    'northeast-bar': './northeast-bar.html',
    'east-line': './east-line.html',
    'central-line': './central-line.html',
    'west-line': './west-line.html',
    'northeast-line': './northeast-line.html'
  };
  var frame = document.getElementById('chartFrame');
  var openChart = document.getElementById('openChart');
  var title = document.getElementById('viewTitle');
  var eyebrow = document.getElementById('eyebrow');
  var sub = document.getElementById('viewSub');
  var buttons = Array.prototype.slice.call(document.querySelectorAll('.view-btn'));
  var current = 'east-bar';

  function validView(value) {
    return Object.prototype.hasOwnProperty.call(VIEWS, value) ? value : 'east-bar';
  }

  function injectFrameCss() {
    try {
      var doc = frame.contentDocument;
      if (!doc || !doc.head) return;
      var style = doc.getElementById('shell-injected');
      if (!style) {
        style = doc.createElement('style');
        style.id = 'shell-injected';
        doc.head.appendChild(style);
      }
      style.textContent = [
        'html,body{background:#fff !important;}',
        'body{padding:0 !important;}',
        '.card{width:100% !important;height:100% !important;border-radius:0 !important;box-shadow:none !important;background:#fff !important;}'
      ].join('');
      setTimeout(function () {
        try { frame.contentWindow.dispatchEvent(new Event('resize')); } catch (e2) { /* ignore */ }
      }, 60);
    } catch (e) { /* ignore */ }
  }

  function activate(view, push) {
    current = validView(view);
    buttons.forEach(function (b) { b.classList.toggle('active', b.dataset.view === current); });
    var meta = META[current];
    eyebrow.textContent = meta.eyebrow;
    title.textContent = meta.title;
    sub.textContent = meta.sub;
    var next = VIEWS[current];
    if (frame.getAttribute('src') !== next) frame.setAttribute('src', next);
    openChart.href = next;
    if (push) {
      var url = new URL(window.location.href);
      if (current === 'east-bar') url.searchParams.delete('v');
      else url.searchParams.set('v', current);
      history.replaceState(null, '', url.pathname + url.search);
    }
  }

  buttons.forEach(function (b) {
    b.addEventListener('click', function () { activate(b.dataset.view, true); });
  });
  document.getElementById('replay').addEventListener('click', function () {
    frame.setAttribute('src', VIEWS[current] + '?r=' + Date.now());
  });
  frame.addEventListener('load', injectFrameCss);
  activate(new URLSearchParams(window.location.search).get('v'), false);
})();
</script>
</body>
</html>
