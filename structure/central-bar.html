<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>湖北 · 安徽 2000—2023 三次产业结构动态堆积柱</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #eef1f6;
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    position: relative;
    width: 640px;
    height: 660px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 12px 36px rgba(31, 45, 61, 0.12);
    overflow: hidden;
  }
  #chart { width: 100%; height: 100%; }

  /* 年份角标 */
  .year-badge {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    padding: 6px 22px;
    background: #2f3542;
    color: #fff;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 3px;
    border-radius: 10px;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 6px 16px rgba(47, 53, 66, 0.22);
    pointer-events: none;
  }
  .subtitle {
    position: absolute;
    top: 68px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    letter-spacing: 2px;
    color: #97a1af;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="card">
  <div id="chart"></div>
  <div class="year-badge" id="yearBadge">2000</div>
  <div class="subtitle">湖北 · 安徽　三次产业结构占比</div>
</div>

<script>
(function () {
  'use strict';

  /* ================= 数据 ================= */
  const PROVINCES = ['湖北', '安徽'];

  // 每条记录：{ year, hb:[一,二,三], ah:[一,二,三] }
  const DATA = [
    { year: 2000, hb: [18.51, 40.05, 41.44], ah: [23.46, 33.59, 42.95] },
    { year: 2001, hb: [17.65, 40.02, 42.33], ah: [21.44, 35.47, 43.09] },
    { year: 2002, hb: [16.58, 39.98, 43.43], ah: [20.19, 34.70, 45.11] },
    { year: 2003, hb: [16.57, 40.46, 42.97], ah: [17.13, 35.60, 47.27] },
    { year: 2004, hb: [17.95, 40.46, 41.59], ah: [18.24, 35.43, 46.33] },
    { year: 2005, hb: [16.34, 42.13, 41.54], ah: [16.77, 38.14, 45.09] },
    { year: 2006, hb: [14.74, 42.83, 42.43], ah: [15.31, 40.18, 44.50] },
    { year: 2007, hb: [13.87, 43.00, 43.13], ah: [13.82, 41.74, 44.44] },
    { year: 2008, hb: [14.66, 43.27, 42.07], ah: [13.55, 43.28, 43.17] },
    { year: 2009, hb: [12.79, 44.97, 42.24], ah: [12.50, 44.46, 43.04] },
    { year: 2010, hb: [12.39, 46.99, 40.62], ah: [11.88, 47.47, 40.65] },
    { year: 2011, hb: [12.21, 48.28, 39.51], ah: [11.30, 49.53, 39.17] },
    { year: 2012, hb: [11.67, 48.66, 39.67], ah: [10.84, 49.68, 39.47] },
    { year: 2013, hb: [11.15, 45.82, 43.02], ah: [10.40, 48.99, 40.60] },
    { year: 2014, hb: [10.42, 45.16, 44.42], ah: [10.03, 48.00, 41.97] },
    { year: 2015, hb: [10.14, 44.26, 45.60], ah: [9.84,  44.89, 45.27] },
    { year: 2016, hb: [10.09, 43.02, 46.89], ah: [9.29,  42.97, 47.74] },
    { year: 2017, hb: [9.38,  41.77, 48.86], ah: [8.57,  42.07, 49.36] },
    { year: 2018, hb: [8.36,  41.42, 50.21], ah: [7.67,  41.00, 51.33] },
    { year: 2019, hb: [8.36,  40.38, 51.26], ah: [7.76,  39.63, 52.61] },
    { year: 2020, hb: [9.61,  38.03, 52.36], ah: [8.24,  39.57, 52.18] },
    { year: 2021, hb: [9.25,  38.41, 52.34], ah: [7.80,  39.27, 52.93] },
    { year: 2022, hb: [9.32,  37.33, 53.35], ah: [7.72,  38.87, 53.40] },
    { year: 2023, hb: [8.92,  36.54, 54.54], ah: [7.25,  38.85, 53.91] }
  ];

  const MAX_IDX     = DATA.length - 1;   // 23
  const MS_PER_YEAR = 800;               // 每年前进速度
  const HOLD_MS     = 1200;              // 播到 2023 后停留时间

  const COLOR_1 = '#4CAF50';             // 一产 绿
  const COLOR_2 = '#FF9800';             // 二产 橙
  const COLOR_3 = '#2196F3';             // 三产 蓝

  /* ================= 初始化图表 ================= */
  const chartDom = document.getElementById('chart');
  const chart = echarts.init(chartDom, null, { renderer: 'canvas' });

  const option = {
    animation: false,
    grid: { left: 72, right: 56, top: 132, bottom: 84 },
    legend: {
      bottom: 22,
      itemWidth: 16,
      itemHeight: 12,
      itemGap: 30,
      textStyle: { color: '#4a4a4a', fontSize: 14 }
    },
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'shadow' }
    },
    xAxis: {
      type: 'category',
      data: PROVINCES,
      axisLine: { lineStyle: { color: '#dcdfe6' } },
      axisTick: { show: false },
      axisLabel: {
        color: '#4a4a4a',
        fontSize: 18,
        fontWeight: 'bold',
        letterSpacing: 2
      }
    },
    yAxis: {
      type: 'value',
      min: 0,
      max: 100,
      interval: 20,
      axisLabel: { formatter: '{value}%', color: '#8b95a1', fontSize: 13 },
      axisLine: { show: false },
      axisTick: { show: false },
      splitLine: { lineStyle: { color: '#eef0f3', type: 'dashed' } }
    },
    series: [
      {
        name: '第一产业',
        type: 'bar',
        stack: 'total',
        barWidth: 120,
        itemStyle: { color: COLOR_1 },
        label: {
          show: true,
          position: 'inside',
          color: '#ffffff',
          fontSize: 12,
          fontWeight: 'bold',
          formatter: function (p) { return p.value.toFixed(1) + '%'; }
        },
        data: [DATA[0].hb[0], DATA[0].ah[0]]
      },
      {
        name: '第二产业',
        type: 'bar',
        stack: 'total',
        barWidth: 120,
        itemStyle: { color: COLOR_2 },
        label: {
          show: true,
          position: 'inside',
          color: '#ffffff',
          fontSize: 12,
          fontWeight: 'bold',
          formatter: function (p) { return p.value.toFixed(1) + '%'; }
        },
        data: [DATA[0].hb[1], DATA[0].ah[1]]
      },
      {
        name: '第三产业',
        type: 'bar',
        stack: 'total',
        barWidth: 120,
        itemStyle: { color: COLOR_3 },
        label: {
          show: true,
          position: 'inside',
          color: '#ffffff',
          fontSize: 12,
          fontWeight: 'bold',
          formatter: function (p) { return p.value.toFixed(1) + '%'; }
        },
        data: [DATA[0].hb[2], DATA[0].ah[2]]
      }
    ]
  };

  chart.setOption(option);

  /* ================= 动画状态机 ================= */
  const badge = document.getElementById('yearBadge');

  let progress    = 0;
  let phase       = 'run';
  let holdElapsed = 0;
  let lastTs      = 0;
  let lastYear    = -1;

  /**
   * 根据 progress 计算两省三产占比并刷新图表
   * 相邻年份线性插值，每根柱子的分界线连续滑动
   */
  function draw() {
    const idx = Math.min(Math.floor(progress), MAX_IDX - 1);
    const t   = progress - idx;
    const a   = DATA[idx];
    const b   = DATA[Math.min(idx + 1, MAX_IDX)];

    const keys = ['hb', 'ah'];
    const v1 = [], v2 = [], v3 = [];

    for (let k = 0; k < keys.length; k++) {
      const key = keys[k];
      let s1 = a[key][0] + (b[key][0] - a[key][0]) * t;
      let s2 = a[key][1] + (b[key][1] - a[key][1]) * t;
      let s3 = a[key][2] + (b[key][2] - a[key][2]) * t;

      // 归一化到 100%，保证柱顶落在 100% 刻度线上
      const sum = s1 + s2 + s3;
      v1.push(s1 / sum * 100);
      v2.push(s2 / sum * 100);
      v3.push(s3 / sum * 100);
    }

    chart.setOption({
      series: [
        { data: v1 },
        { data: v2 },
        { data: v3 }
      ]
    }, { lazyUpdate: true });

    const year = DATA[Math.round(progress)].year;
    if (year !== lastYear) {
      lastYear = year;
      badge.textContent = year;
    }
  }

  function tick(ts) {
    requestAnimationFrame(tick);

    if (!lastTs) { lastTs = ts; return; }
    let dt = ts - lastTs;
    lastTs = ts;
    if (dt > 120) dt = 120;

    if (phase === 'run') {
      progress += dt / MS_PER_YEAR;
      if (progress >= MAX_IDX) {
        progress = MAX_IDX;
        phase = 'hold';
        holdElapsed = 0;
      }
    } else {
      holdElapsed += dt;
      if (holdElapsed >= HOLD_MS) {
        progress = 0;
        phase = 'run';
      }
    }

    draw();
  }

  // 首帧
  draw();
  requestAnimationFrame(tick);

  /* ================= 自适应 ================= */
  window.addEventListener('resize', function () {
    chart.resize();
  });
})();
</script>
</body>
</html>
