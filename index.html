<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>湖北省六维经济画像 (2000-2023)</title>
<!-- 引入 ECharts -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background-color: #ffffff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  #chart {
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>

<div id="chart"></div>

<script>
(function () {
  'use strict';

  /* ================= 1. 基础配置与全样本极值 ================= */
  const PROVINCE = '湖北省';
  const YEARS = [];
  for (let i = 2000; i <= 2023; i++) YEARS.push(i);

  // 维度定义与全样本极值（基于8省24年共192个样本的真实极值，用于归一化）
  const DIMENSIONS = [
    { key: 'primary', name: '一产占比', unit: '%', min: 2.71, max: 23.78, color: '#4CAF50' },
    { key: 'secondary', name: '二产占比', unit: '%', min: 33.59, max: 55.78, color: '#FF9800' },
    { key: 'tertiary', name: '三产占比', unit: '%', min: 36.44, max: 57.90, color: '#2196F3' },
    { key: 'fir', name: '金融相关率', unit: '倍', min: 1.603, max: 5.305, color: '#9C27B0' },
    { key: 'fiscal', name: '财政汲取率', unit: '%', min: 0.0504, max: 0.1713, color: '#F44336' },
    { key: 'openness', name: '开放程度', unit: '%', min: 0.0531, max: 1.5918, color: '#00BCD4' }
  ];

  // 湖北真实原始数据 (2000-2023)
  const rawData = {
    primary: [18.51, 17.65, 16.58, 16.57, 17.95, 16.34, 14.74, 13.87, 14.66, 12.79, 12.39, 12.21, 11.67, 11.15, 10.42, 10.14, 10.09, 9.38, 8.36, 8.36, 9.61, 9.25, 9.32, 8.92],
    secondary: [40.05, 40.02, 39.98, 40.46, 40.46, 42.13, 42.83, 43.0, 43.27, 44.97, 46.99, 48.28, 48.66, 45.82, 45.16, 44.26, 43.02, 41.77, 41.42, 40.38, 38.03, 38.41, 37.33, 36.54],
    tertiary: [41.44, 42.33, 43.43, 42.97, 41.59, 41.54, 42.43, 43.13, 42.07, 42.24, 40.62, 39.51, 39.67, 43.02, 44.42, 45.6, 46.89, 48.86, 50.21, 51.26, 52.36, 52.34, 53.35, 54.54],
    fir: [1.652, 2.068, 2.216, 2.309, 2.203, 2.099, 2.101, 1.992, 1.934, 2.250, 2.236, 2.018, 2.068, 2.155, 2.206, 2.343, 2.505, 2.591, 2.533, 2.409, 2.924, 2.790, 2.859, 2.990],
    fiscal: [0.0599, 0.0591, 0.0571, 0.0539, 0.0552, 0.0573, 0.0623, 0.0615, 0.0607, 0.0607, 0.0613, 0.0755, 0.0795, 0.0848, 0.0891, 0.0980, 0.0919, 0.0863, 0.0780, 0.0744, 0.0584, 0.0655, 0.0614, 0.0650],
    openness: [0.0746, 0.0757, 0.0768, 0.0878, 0.0997, 0.1133, 0.1226, 0.1177, 0.1220, 0.0877, 0.1064, 0.1070, 0.0880, 0.0872, 0.0918, 0.0926, 0.0770, 0.0833, 0.0822, 0.0866, 0.0998, 0.1073, 0.1155, 0.1136]
  };

  /* ================= 2. 辅助函数：归一化 ================= */
  function normalize(val, min, max) {
    return ((val - min) / (max - min)) * 100;
  }

  // 根据年份索引获取真实的原始数据，并计算归一化得分
  function getDataByIndex(index) {
    return DIMENSIONS.map(dim => {
      const rawVal = rawData[dim.key][index];
      const score = normalize(rawVal, dim.min, dim.max);
      
      // 格式化显示值（百分比或倍数）
      let displayVal = rawVal.toFixed(2);
      if (dim.key === 'fiscal' || dim.key === 'openness') {
        displayVal = (rawVal * 100).toFixed(2);
      }

      return {
        name: dim.name,
        value: score,          // 用于画图：0-100 的得分
        raw: rawVal,           // 原始值
        display: displayVal,   // 用于展示的字符串
        unit: dim.unit,
        itemStyle: { color: dim.color }
      };
    });
  }

  /* ================= 3. 初始化图表 ================= */
  const chart = echarts.init(document.getElementById('chart'), null, { renderer: 'canvas' });

  // 初始配置
  const option = {
    // 关闭 ECharts 内置动画，由 requestAnimationFrame 接管，保证绝对丝滑
    animation: false,
    
    title: {
      text: PROVINCE + '六维经济画像',
      left: 'center',
      top: 30,
      textStyle: { fontSize: 22, fontWeight: 'bold', color: '#2f3542' }
    },
    
    tooltip: {
      trigger: 'item',
      backgroundColor: 'rgba(255, 255, 255, 0.95)',
      borderColor: '#e5e8ee',
      borderWidth: 1,
      padding: [10, 14],
      textStyle: { color: '#333', fontSize: 13 },
      formatter: function (params) {
        const d = params.data;
        return `<div style="font-weight:bold; margin-bottom:6px; color:${params.color}">${d.name}</div>
                原始值：${d.display}${d.unit}<br/>
                归一化得分：<span style="font-weight:bold;">${d.value.toFixed(1)}</span>`;
      }
    },
    
    // 玫瑰图系列
    series: [
      {
        type: 'pie',
        roseType: 'radius', // 半径模式：花瓣长度代表数值
        radius: ['15%', '65%'],
        center: ['50%', '55%'],
        itemStyle: {
          borderRadius: 6,
          borderColor: '#fff',
          borderWidth: 2
        },
        label: {
          show: true,
          formatter: '{b}',
          color: '#666',
          fontSize: 14,
          fontWeight: 'bold'
        },
        labelLine: {
          length: 15,
          length2: 20
        },
        data: getDataByIndex(0) // 初始为2000年
      }
    ],
    
    // 使用 graphic 在图表中心绘制年份
    graphic: {
      elements: [
        {
          type: 'text',
          left: 'center',
          top: '53%',
          style: {
            text: '2000',
            font: 'bolder 50px monospace',
            fill: '#2f3542',
            textAlign: 'center',
            textVerticalAlign: 'middle'
          },
          z: 100
        }
      ]
    }
  };

  chart.setOption(option);

  /* ================= 4. 平滑动画引擎 ================= */
  let currentYearIdx = 0;
  let progress = 0;             // 0 到 1 的插值进度
  const MS_PER_YEAR = 1000;     // 每年过度耗时 1000ms
  const HOLD_MS = 1500;         // 播到2023年停留时间
  let holdTimer = 0;
  let lastTs = 0;

  function renderFrame(ts) {
    requestAnimationFrame(renderFrame);

    if (!lastTs) { lastTs = ts; return; }
    let dt = ts - lastTs;
    lastTs = ts;
    if (dt > 100) dt = 100; // 防止切换页面回来跳帧

    if (currentYearIdx >= YEARS.length - 1) {
      // 到达2023年，进入停留阶段
      holdTimer += dt;
      if (holdTimer >= HOLD_MS) {
        // 重置回2000年
        currentYearIdx = 0;
        progress = 0;
        holdTimer = 0;
        updateChart(0, 0);
      } else {
        // 保持最后一帧
        updateChart(currentYearIdx, 0);
      }
      return;
    }

    // 累加进度
    progress += dt / MS_PER_YEAR;

    if (progress >= 1) {
      progress = 0;
      currentYearIdx++;
    }

    // 在 currentYearIdx 到 currentYearIdx + 1 之间平滑插值
    updateChart(currentYearIdx, progress);
  }

  // 核心更新函数：插值并渲染
  function updateChart(startIdx, t) {
    const endIdx = Math.min(startIdx + 1, YEARS.length - 1);
    
    // 如果已经到了最后一年，或者 t 为 0，直接使用起点数据
    if (startIdx === endIdx || t === 0) {
      const data = getDataByIndex(startIdx);
      chart.setOption({
        series: [{ data: data }],
        graphic: { elements: [{ style: { text: YEARS[startIdx].toString() } }] }
      });
      return;
    }

    // 计算相邻两年的数据并在中间进行线性插值（保证半径过渡顺滑）
    const startData = getDataByIndex(startIdx);
    const endData = getDataByIndex(endIdx);

    const interpolatedData = startData.map((startItem, i) => {
      const endItem = endData[i];
      // 对归一化得分(value)和原始值(raw)进行插值
      const valScore = startItem.value + (endItem.value - startItem.value) * t;
      const valRaw = startItem.raw + (endItem.raw - startItem.raw) * t;
      
      let displayVal = valRaw.toFixed(2);
      if (startItem.name === '财政汲取率' || startItem.name === '开放程度') {
        displayVal = (valRaw * 100).toFixed(2);
      }

      return {
        name: startItem.name,
        value: valScore,
        raw: valRaw,
        display: displayVal,
        unit: startItem.unit,
        itemStyle: startItem.itemStyle
      };
    });

    // 计算当前显示年份（如果是插值，取最近的年份）
    const displayYear = t < 0.5 ? YEARS[startIdx] : YEARS[endIdx];

    chart.setOption({
      series: [{ data: interpolatedData }],
      graphic: { elements: [{ style: { text: displayYear.toString() } }] }
    });
  }

  // 启动动画
  requestAnimationFrame(renderFrame);

  /* ================= 5. 窗口自适应 ================= */
  window.addEventListener('resize', function () {
    chart.resize();
  });

})();
</script>
</body>
</html>
