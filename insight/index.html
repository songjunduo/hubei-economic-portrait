<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="中国八省经济发展、金融深化与省际差距的动态图集。" />
<title>八省动态图谱 · 关系与差距</title>
<style>
  :root {
    --ink: #1c2430;
    --muted: #6b7785;
    --line: #dde5ee;
    --accent: #2f5d8a;
    --gold: #b98b4e;
    --bg: #eef3f8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    color: var(--ink);
    background: var(--bg);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  }
  .shell { height: 100vh; display: flex; flex-direction: column; }
  .topbar {
    display: flex;
    align-items: center;
    gap: 18px;
    min-height: 58px;
    padding: 0 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(14px);
    position: relative;
    z-index: 2;
  }
  .brand { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  .mark {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    border-radius: 9px;
    color: #fff;
    background: linear-gradient(145deg, #284c72, #4377a4);
    font: 700 14px/1 "Songti SC", "SimSun", serif;
    box-shadow: 0 6px 16px rgba(47,93,138,.2);
  }
  .brand-text strong {
    display: block;
    font-family: "Songti SC", "SimSun", serif;
    font-size: 15px;
    line-height: 1.2;
    letter-spacing: .02em;
  }
  .brand-text span {
    display: block;
    margin-top: 2px;
    color: var(--muted);
    font-size: 9px;
    letter-spacing: .14em;
  }
  .tabs {
    display: flex;
    align-items: center;
    gap: 3px;
    flex: 1 1 auto;
    min-width: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    padding: 7px 11px;
    border: 0;
    border-radius: 7px;
    color: #556273;
    background: transparent;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .18s ease, color .18s ease;
  }
  .tab:hover { background: #edf3fa; color: var(--accent); }
  .tab.active { color: #fff; background: var(--ink); box-shadow: 0 5px 12px rgba(27,37,50,.14); }
  .open {
    flex: 0 0 auto;
    color: var(--muted);
    font-size: 11px;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    padding-bottom: 2px;
  }
  .open:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .frame-wrap { flex: 1; min-height: 0; background: #f7f9fc; }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
  @media (max-width: 760px) {
    .topbar { gap: 8px; min-height: 52px; padding: 0 10px; }
    .brand-text { display: none; }
    .tab { padding: 6px 8px; font-size: 11px; }
    .open { display: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="mark">图</div>
      <div class="brand-text">
        <strong>八省动态图谱</strong>
        <span>RELATION · DISPARITY · 2000—2023</span>
      </div>
    </div>
    <nav class="tabs" aria-label="图表切换">
      <button class="tab active" type="button" data-view="bubble">气泡图 · 人均GDP—FIR</button>
      <button class="tab" type="button" data-view="small">小倍图 · 财政—FIR</button>
      <button class="tab" type="button" data-view="dual">双组图 · 差距与关键年份</button>
    </nav>
    <a class="open" id="openChart" href="./bubble.html" target="_blank" rel="noopener">单独打开 ↗</a>
  </header>
  <main class="frame-wrap">
    <iframe id="chartFrame" src="./bubble.html" title="八省人均GDP与FIR气泡动画" loading="eager"></iframe>
  </main>
</div>
<script>
(function () {
  'use strict';
  var VIEWS = {
    bubble: './bubble.html',
    small: './small-multiples.html',
    dual: './dual-panel.html'
  };
  var frame = document.getElementById('chartFrame');
  var openChart = document.getElementById('openChart');
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var current = 'bubble';

  function validView(value) {
    return Object.prototype.hasOwnProperty.call(VIEWS, value) ? value : 'bubble';
  }

  function styleFrame() {
    try {
      var doc = frame.contentDocument;
      if (!doc || !doc.body) return;
      // reset previous scaling
      doc.body.style.zoom = '';
      var style = doc.getElementById('shell-injected');
      if (!style) {
        style = doc.createElement('style');
        style.id = 'shell-injected';
        doc.head.appendChild(style);
      }
      var design = current === 'small' ? { w: 1520, h: 900 } :
        (current === 'dual' ? { w: 1420, h: 780 } : { w: 1080, h: 720 });
      var s = Math.min((frame.clientWidth - 12) / design.w, (frame.clientHeight - 12) / design.h);
      doc.body.style.zoom = String(Math.max(0.35, Math.min(1, s)));
      style.textContent = 'html,body{background:#fff !important;} body{padding:0 !important;overflow:hidden !important;} .card{margin:0 auto !important;}';
    } catch (e) { /* ignore */ }
  }

  function activate(view, push) {
    current = validView(view);
    tabs.forEach(function (tab) { tab.classList.toggle('active', tab.dataset.view === current); });
    var next = VIEWS[current];
    if (frame.getAttribute('src') !== next) frame.setAttribute('src', next);
    openChart.href = next;
    if (push) {
      var url = new URL(window.location.href);
      if (current === 'bubble') url.searchParams.delete('v');
      else url.searchParams.set('v', current);
      history.replaceState(null, '', url.pathname + url.search);
    }
  }

  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () { activate(tab.dataset.view, true); });
  });
  frame.addEventListener('load', styleFrame);
  window.addEventListener('resize', function () { if (current === 'small') styleFrame(); });
  activate(new URLSearchParams(window.location.search).get('v'), false);
})();
</script>
</body>
</html>
