<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>图3 八省金融深化差距：先收敛、后反复、再分化</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #eef1f6;
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
    box-sizing: border-box;
  }
  .card {
    width: 1420px;
    max-width: 100%;
    height: 780px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 12px 36px rgba(31, 45, 61, 0.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .main-title {
    padding: 20px 32px 4px;
    font-size: 22px;
    font-weight: 700;
    color: #2f3542;
    letter-spacing: 1px;
    text-align: center;
  }
  .panels {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 10px;
    padding: 0 12px;
  }
  .panel {
    flex: 1;
    min-width: 0;
    height: 100%;
  }
  .panel > div { width: 100%; height: 100%; }
  .footnote {
    padding: 12px 32px 18px;
    font-size: 12px;
    color: #7a8494;
    line-height: 1.7;
    border-top: 1px solid #f0f2f5;
    background: #fafbfc;
  }
</style>
</head>
<body>
<div class="card">
  <div class="main-title">八省金融深化差距：先收敛、后反复、再分化</div>
  <div class="panels">
    <div class="panel"><div id="chartA"></div></div>
    <div class="panel"><div id="chartB"></div></div>
  </div>
  <div class="footnote">变异系数=八省FIR标准差/八省FIR均值×100%，衡量省际相对差异；2000—2007年持续收敛，2009—2019年反复波动，2020年起再度扩大。</div>
</div>

<script>
(function () {
  'use strict';

  /* ================= 公共参数 ================= */
  const START_YEAR = 2000;
  const END_YEAR   = 2023;
  const MAX_IDX    = END_YEAR - START_YEAR;   // 23

  /* ================= 面板A数据：图3_差异指标 ================= */
  const CV = [32.3, 24.6, 23.2, 20.8, 19.0, 18.6, 17.0, 16.8, 19.4, 20.4, 19.8, 21.0, 21.4, 21.2, 19.7, 20.8, 16.7, 16.5, 17.6, 22.1, 20.6, 19.8, 19.7, 19.0];
  const SD = [0.735, 0.575, 0.580, 0.549, 0.487, 0.467, 0.424, 0.400, 0.467, 0.579, 0.547, 0.553, 0.585, 0.598, 0.568, 0.656, 0.545, 0.536, 0.574, 0.728, 0.753, 0.708, 0.744, 0.756];

  /* ================= 面板B数据：图3_关键年份对比（已按年份转置） ================= */
  const YEAR_GROUPS = ['2000', '2010', '2023'];

  /* 各省颜色与图2保持一致 */
  const PROVINCES = [
    { name: '安徽', color: '#F4B183', values: [1.60306, 2.28282, 3.39434] },
    { name: '广东', color: '#2E75B6', values: [3.72622, 3.52025, 4.58786] },
    { name: '湖北', color: '#E60012', values: [1.65241, 2.23608, 2.98954] },
    { name: '江苏', color: '#9DC3E6', values: [1.67411, 2.44065, 3.69417] },
    { name: '辽宁', color: '#7F7F7F', values: [2.37213, 2.49562, 4.47563] },
    { name: '陕西', color: '#A9D18E', values: [2.92375, 2.61661, 3.56013] },
    { name: '四川', color: '#FFD700', values: [2.13619, 2.87623, 3.76854] },
    { name: '浙江', color: '#F48FB1', values: [2.10775, 3.65846, 5.30520] }
  ];

  /* ================= 面板A：双Y轴折线图 ================= */
  const chartA = echarts.init(document.getElementById('chartA'), null, { renderer: 'canvas' });

  chartA.setOption({
    animation: false,
    title: {
      text: '八省金融深化省际差异变化（2000—2023）',
      left: 'center',
      top: 8,
      textStyle: { fontSize: 15, fontWeight: 'bold', color: '#2f3542' }
    },
    legend: {
      bottom: 14,
      itemWidth: 22,
      itemHeight: 10,
      itemGap: 26,
      textStyle: { color: '#4a4a4a', fontSize: 12 },
      data: ['变异系数（左轴）', '标准差（右轴）']
    },
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'line' },
      valueFormatter: function (v) {
        return v == null ? '-' : (typeof v === 'number' ? v.toFixed(2) : v);
      }
    },
    grid: { left: 74, right: 74, top: 84, bottom: 82 },
    xAxis: {
      type: 'value',
      min: START_YEAR,
      max: END_YEAR,
      interval: 2,
      axisLine: { lineStyle: { color: '#dcdfe6' } },
      axisTick: { show: false },
      splitLine: { show: false },
      axisLabel: {
        color: '#8b95a1',
        fontSize: 11,
        formatter: function (v) { return Math.round(v); }
      }
    },
    yAxis: [
      {
        type: 'value',
        min: 0,
        max: 35,
        interval: 5,
        name: '变异系数(%)',
        nameLocation: 'middle',
        nameGap: 48,
        nameTextStyle: { color: '#2E75B6', fontSize: 12, fontWeight: 'bold' },
        axisLabel: { color: '#2E75B6', fontSize: 11 },
        axisLine: { show: true, lineStyle: { color: '#2E75B6' } },
        axisTick: { show: false },
        splitLine: { lineStyle: { color: '#eef0f3', type: 'dashed' } }
      },
      {
        type: 'value',
        min: 0,
        max: 0.8,
        interval: 0.1,
        name: '标准差',
        nameLocation: 'middle',
        nameGap: 48,
        nameTextStyle: { color: '#ED7D31', fontSize: 12, fontWeight: 'bold' },
        axisLabel: { color: '#ED7D31', fontSize: 11, formatter: function (v) { return v.toFixed(1); } },
        axisLine: { show: true, lineStyle: { color: '#ED7D31' } },
        axisTick: { show: false },
        splitLine: { show: false }
      }
    ],
    series: [
      {
        name: '变异系数（左轴）',
        type: 'line',
        yAxisIndex: 0,
        showSymbol: true,
        symbol: 'circle',
        symbolSize: 5,
        lineStyle: { width: 2.6, color: '#2E75B6', type: 'solid' },
        itemStyle: { color: '#2E75B6' },
        emphasis: { focus: 'series' },
        data: []
      },
      {
        name: '标准差（右轴）',
        type: 'line',
        yAxisIndex: 1,
        showSymbol: true,
        symbol: 'circle',
        symbolSize: 5,
        lineStyle: { width: 2.4, color: '#ED7D31', type: 'dashed' },
        itemStyle: { color: '#ED7D31' },
        emphasis: { focus: 'series' },
        data: []
      }
    ]
  });

  /* ================= 面板B：转置后的簇状柱状图 ================= */
  const chartB = echarts.init(document.getElementById('chartB'), null, { renderer: 'canvas' });

  chartB.setOption({
    animation: false,
    title: {
      text: '八省 FIR 关键年份对比（2000 / 2010 / 2023）',
      left: 'center',
      top: 8,
      textStyle: { fontSize: 15, fontWeight: 'bold', color: '#2f3542' }
    },
    legend: {
      bottom: 10,
      itemWidth: 14,
      itemHeight: 10,
      itemGap: 12,
      textStyle: { color: '#4a4a4a', fontSize: 11 },
      data: PROVINCES.map(function (p) { return p.name; })
    },
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'shadow' },
      valueFormatter: function (v) { return v == null ? '-' : v.toFixed(3); }
    },
    grid: { left: 58, right: 24, top: 84, bottom: 92 },
    xAxis: {
      type: 'category',
      data: YEAR_GROUPS,
      axisLine: { lineStyle: { color: '#dcdfe6' } },
      axisTick: { show: false },
      axisLabel: {
        color: '#2f3542',
        fontSize: 14,
        fontWeight: 'bold'
      }
    },
    yAxis: {
      type: 'value',
      min: 0,
      max: 6,
      interval: 1,
      name: 'FIR',
      nameTextStyle: { color: '#8b95a1', fontSize: 12, padding: [0, 0, 8, 0] },
      axisLabel: { color: '#8b95a1', fontSize: 11 },
      axisLine: { show: false },
      axisTick: { show: false },
      splitLine: { lineStyle: { color: '#eef0f3', type: 'dashed' } }
    },
    series: PROVINCES.map(function (p) {
      return {
        name: p.name,
        type: 'bar',
        barGap: '8%',
        itemStyle: { color: p.color, borderRadius: [2, 2, 0, 0] },
        emphasis: { focus: 'series' },
        data: []
      };
    })
  });

  /* ================= 面板A动画状态（循环） ================= */
  const A_MS_PER_YEAR = 260;   // ← 由 520 调为 260，折线图速度翻倍
  const A_HOLD_MS     = 1200;  // 停留时间略缩短，循环更紧凑

  let aProgress    = 0;
  let aPhase       = 'run';
  let aHoldElapsed = 0;

  function buildLineData(vals, prog) {
    const idx = Math.min(Math.floor(prog), MAX_IDX);
    const t   = prog - idx;
    const pts = [];
    for (let i = 0; i <= idx; i++) {
      pts.push([START_YEAR + i, vals[i]]);
    }
    if (prog < MAX_IDX && t > 0.0001) {
      const y = vals[idx] + (vals[idx + 1] - vals[idx]) * t;
      pts.push([START_YEAR + prog, y]);
    }
    return pts;
  }

  function drawA() {
    chartA.setOption({
      series: [
        { data: buildLineData(CV, aProgress) },
        { data: buildLineData(SD, aProgress) }
      ]
    }, { lazyUpdate: true });
  }

  /* ================= 面板B动画状态（只播一次，不循环） ================= */
  const B_MS_PER_GROUP = 700;
  let bProgress = 0;
  let bPhase    = 'run';   // 'run' | 'done'

  function buildSeriesData(vals, prog) {
    return vals.map(function (v, i) {
      const local = prog - i;
      if (local <= 0) return 0;
      if (local >= 1) return v;
      return v * local;
    });
  }

  function drawB() {
    chartB.setOption({
      series: PROVINCES.map(function (p) {
        return { data: buildSeriesData(p.values, bProgress) };
      })
    }, { lazyUpdate: true });
  }

  /* ================= 统一动画循环 ================= */
  let lastTs = 0;

  function tick(ts) {
    requestAnimationFrame(tick);

    if (!lastTs) { lastTs = ts; return; }
    let dt = ts - lastTs;
    lastTs = ts;
    if (dt > 120) dt = 120;   // 切标签页回来后防止跳帧

    /* ---- 面板A：循环播放（提速） ---- */
    if (aPhase === 'run') {
      aProgress += dt / A_MS_PER_YEAR;
      if (aProgress >= MAX_IDX) {
        aProgress = MAX_IDX;
        aPhase = 'hold';
        aHoldElapsed = 0;
      }
    } else {
      aHoldElapsed += dt;
      if (aHoldElapsed >= A_HOLD_MS) {
        aProgress = 0;
        aPhase = 'run';
      }
    }
    drawA();

    /* ---- 面板B：只播一次，播完停在最终状态 ---- */
    if (bPhase === 'run') {
      bProgress += dt / B_MS_PER_GROUP;
      if (bProgress >= 3) {
        bProgress = 3;
        bPhase = 'done';
      }
      drawB();
    }
  }

  // 首帧
  drawA();
  drawB();
  requestAnimationFrame(tick);

  /* ================= 自适应 ================= */
  window.addEventListener('resize', function () {
    chartA.resize();
    chartB.resize();
  });
})();
</script>
</body>
</html>
