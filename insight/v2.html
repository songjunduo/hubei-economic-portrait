<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="中国八省经济发展、金融深化与省际差距的动态图集。" />
<title>八省动态图谱 · 关系与差距</title>
<style>
  :root {
    --ink: #1c2430;
    --muted: #6b7785;
    --line: #dde5ee;
    --bg: #f4f7fb;
    --accent: #2f5d8a;
    --gold: #b98b4e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    color: var(--ink);
    background:
      radial-gradient(1100px 680px at 8% -12%, #e5eef8 0%, transparent 55%),
      radial-gradient(900px 620px at 102% -4%, #f6ede1 0%, transparent 48%),
      var(--bg);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  }
  .app { display: grid; grid-template-columns: 252px minmax(0, 1fr); height: 100vh; }
  aside {
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 26px 18px 20px;
    background: rgba(255,255,255,.72);
    border-right: 1px solid rgba(221,229,238,.9);
    backdrop-filter: blur(14px);
  }
  .brand { display: flex; align-items: center; gap: 12px; padding: 0 6px; }
  .mark {
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    color: #fff;
    background: linear-gradient(145deg, #284c72, #3f739f);
    font-size: 17px;
    font-weight: 700;
    box-shadow: 0 8px 18px rgba(47,93,138,.2);
  }
  .brand h1 { margin: 0; font-size: 17px; line-height: 1.25; letter-spacing: .01em; }
  .brand p { margin: 5px 0 0; color: var(--muted); font-size: 11px; letter-spacing: .16em; }
  .lede { margin: 22px 6px 8px; color: var(--muted); font-size: 12px; line-height: 1.8; }
  #nav { margin-top: 8px; overflow: auto; padding: 2px 2px 8px; }
  .group { margin-top: 14px; }
  .group-title { margin: 0 8px 6px; color: #98a4b2; font-size: 10px; letter-spacing: .2em; }
  .view-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 9px 10px;
    border: 0;
    border-radius: 8px;
    color: #435061;
    background: transparent;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: background .18s ease, color .18s ease, transform .18s ease;
  }
  .view-btn:hover { background: #edf3fa; color: var(--accent); transform: translateX(2px); }
  .view-btn.active { background: var(--ink); color: #fff; box-shadow: 0 6px 14px rgba(28,36,48,.16); }
  .view-btn .kind { color: #a3afbc; font-size: 10px; letter-spacing: .08em; }
  .view-btn.active .kind { color: rgba(255,255,255,.55); }
  .aside-note {
    margin-top: auto;
    padding: 14px 8px 0;
    border-top: 1px solid var(--line);
    color: #8b97a5;
    font-size: 11px;
    line-height: 1.8;
  }
  .aside-note a { display: inline-block; margin-top: 7px; color: var(--accent); text-decoration: none; }
  .aside-note a:hover { text-decoration: underline; }
  main { min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 26px 30px 16px; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
  .eyebrow { margin: 0 0 7px; color: var(--gold); font-size: 11px; font-weight: 600; letter-spacing: .18em; }
  .top h2 {
    margin: 0;
    font-family: "Songti SC", "SimSun", serif;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: .02em;
  }
  .sub { margin: 7px 0 0; color: var(--muted); font-size: 12px; letter-spacing: .04em; }
  .actions { display: flex; align-items: center; gap: 8px; }
  .badge {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border: 1px solid rgba(185,139,78,.32);
    border-radius: 10px;
    color: var(--gold);
    background: rgba(255,255,255,.58);
    font-size: 11px;
    white-space: nowrap;
  }
  .badge strong { font-size: 18px; letter-spacing: .03em; }
  .replay {
    padding: 8px 12px;
    border: 1px solid rgba(47,93,138,.24);
    border-radius: 8px;
    color: var(--accent);
    background: rgba(255,255,255,.7);
    font: inherit;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
  }
  .replay:hover { background: #e8f0f8; }
  .chart-card {
    position: relative;
    flex: 1 1 auto;
    min-height: 420px;
    margin-top: 20px;
    overflow: hidden;
    border: 1px solid rgba(221,229,238,.95);
    border-radius: 16px;
    background: rgba(255,255,255,.9);
    box-shadow: 0 18px 44px rgba(36,58,80,.08);
  }
  #chartFrame { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
  .foot {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    margin: 9px 2px 0;
    color: #98a4b1;
    font-size: 10px;
    line-height: 1.7;
  }
  .foot a { color: var(--accent); text-decoration: none; white-space: nowrap; }
  .foot a:hover { text-decoration: underline; }
  @media (max-width: 900px) {
    body { overflow: auto; }
    .app { display: block; height: auto; min-height: 100%; }
    aside { padding: 18px 16px 14px; border-right: 0; border-bottom: 1px solid var(--line); }
    .lede, .aside-note { display: none; }
    #nav { display: flex; gap: 4px; padding-top: 12px; overflow-x: auto; }
    .group { margin: 0; }
    .group-title { display: none; }
    .view-btn { width: auto; padding: 7px 10px; }
    .view-btn .kind { display: none; }
    main { padding: 18px 16px 14px; }
    .top h2 { font-size: 26px; }
    .badge { display: none; }
    .chart-card { min-height: 68vh; margin-top: 14px; }
    .foot { display: block; }
    .foot a { display: inline-block; margin-top: 5px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <div class="mark">图</div>
      <div>
        <h1>八省动态<br />图谱</h1>
        <p>2000 — 2023</p>
      </div>
    </div>
    <p class="lede">三张图：气泡看省际位置，小倍图看财政与 FIR，双组图看差距演化。进入页面即播放动画。</p>
    <nav id="nav" aria-label="图表">
      <div class="group">
        <p class="group-title">关系与差距</p>
        <button class="view-btn active" type="button" data-view="bubble">气泡图 <span class="kind">人均GDP—FIR</span></button>
        <button class="view-btn" type="button" data-view="small">小倍图 <span class="kind">财政—FIR</span></button>
        <button class="view-btn" type="button" data-view="dual">双组图 <span class="kind">差距与年份</span></button>
      </div>
    </nav>
    <div class="aside-note">气泡图与双组图自动播放动画；小倍图为八省静态面板。图中关系为探索性展示，不代表因果。<br /><a href="../structure/">← 产业结构</a>　<a href="../fir/">区域金融深化</a></div>
  </aside>

  <main>
    <div class="top">
      <div>
        <p class="eyebrow" id="eyebrow">关系 · 八省</p>
        <h2 id="viewTitle">人均 GDP 与 FIR</h2>
        <p class="sub" id="viewSub">八省气泡动画 · 2000—2023</p>
      </div>
      <div class="actions">
        <div class="badge"><strong>2000—2023</strong><span>动画</span></div>
        <button class="replay" id="replay" type="button">重播</button>
      </div>
    </div>

    <section class="chart-card" aria-label="八省关系与差距动画">
      <iframe id="chartFrame" src="./bubble.html" title="八省人均GDP与FIR气泡动画" loading="eager"></iframe>
    </section>

    <p class="foot">
      <span>注：横轴人均 GDP 与纵轴 FIR 均含 GDP，仅作探索性展示；双组图呈现省际差距的阶段性变化。</span>
      <a id="openChart" href="./bubble.html" target="_blank" rel="noopener">单独打开当前图 ↗</a>
    </p>
  </main>
</div>

<script>
(function () {
  'use strict';
  var META = {
    bubble: { eyebrow: '关系 · 八省', title: '人均 GDP 与 FIR', sub: '八省气泡动画 · 2000—2023' },
    small: { eyebrow: '财政 · 八省', title: '财政占比与 FIR', sub: '八省小倍图 · 2000—2023' },
    dual: { eyebrow: '差距 · 八省', title: '差距与关键年份', sub: '省际差距与关键年份 · 2000—2023' }
  };
  var VIEWS = {
    bubble: './bubble.html',
    small: './small-multiples.html',
    dual: './dual-panel.html'
  };
  var frame = document.getElementById('chartFrame');
  var openChart = document.getElementById('openChart');
  var title = document.getElementById('viewTitle');
  var eyebrow = document.getElementById('eyebrow');
  var sub = document.getElementById('viewSub');
  var buttons = Array.prototype.slice.call(document.querySelectorAll('.view-btn'));
  var current = 'bubble';

  function validView(value) {
    return Object.prototype.hasOwnProperty.call(VIEWS, value) ? value : 'bubble';
  }

  function styleFrame() {
    try {
      var doc = frame.contentDocument;
      if (!doc || !doc.body) return;
      doc.body.style.zoom = '';
      var style = doc.getElementById('shell-injected');
      if (!style) {
        style = doc.createElement('style');
        style.id = 'shell-injected';
        doc.head.appendChild(style);
      }
      var design = current === 'small' ? { w: 1520, h: 900 } :
        (current === 'dual' ? { w: 1420, h: 780 } : { w: 1080, h: 720 });
      var s = Math.min((frame.clientWidth - 12) / design.w, (frame.clientHeight - 12) / design.h);
      doc.body.style.zoom = String(Math.max(0.32, Math.min(1, s)));
      style.textContent = 'html,body{background:#fff !important;} body{padding:0 !important;overflow:hidden !important;} .card{margin:0 auto !important;}';
    } catch (e) { /* ignore */ }
  }

  function activate(view, push) {
    current = validView(view);
    buttons.forEach(function (b) { b.classList.toggle('active', b.dataset.view === current); });
    var meta = META[current];
    eyebrow.textContent = meta.eyebrow;
    title.textContent = meta.title;
    sub.textContent = meta.sub;
    var next = VIEWS[current];
    if (frame.getAttribute('src') !== next) frame.setAttribute('src', next);
    openChart.href = next;
    if (push) {
      var url = new URL(window.location.href);
      if (current === 'bubble') url.searchParams.delete('v');
      else url.searchParams.set('v', current);
      history.replaceState(null, '', url.pathname + url.search);
    }
  }

  buttons.forEach(function (b) {
    b.addEventListener('click', function () { activate(b.dataset.view, true); });
  });
  document.getElementById('replay').addEventListener('click', function () {
    frame.setAttribute('src', VIEWS[current] + '?r=' + Date.now());
  });
  frame.addEventListener('load', styleFrame);
  window.addEventListener('resize', function () { styleFrame(); });
  activate(new URLSearchParams(window.location.search).get('v'), false);
})();
</script>
</body>
</html>
